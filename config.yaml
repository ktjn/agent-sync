agents:
  claude:
    instructions:
      path: "~/.claude/CLAUDE.md"
      master: "AGENTS.md"
    skills_dir: "~/.claude/skills"
  codex:
    instructions:
      path: "~/.codex/AGENTS.md"
      master: "AGENTS.md"
    skills_dir: "~/.codex/skills"
  opencode:
    # no global instructions file found under ~/.config/opencode at migration time
    skills_dir: "~/.config/opencode/skills"
  junie:
    # Junie reads project-level .junie/guidelines.md, not a global instructions file;
    # no global instructions target configured.
    skills_dir: "~/.junie/skills"
  pi:
    # Confirmed from @earendil-works/pi-coding-agent's bundled source: global
    # instructions/skills live under its agent dir (~/.pi/agent by default,
    # overridable via env), checking AGENTS.override.md > AGENTS.md >
    # AGENTS.MD > CLAUDE.md > CLAUDE.MD for instructions. pi also
    # auto-discovers ~/.agents/skills and ancestor .agents/skills dirs as a
    # bonus source, but that's separate from this managed skills_dir.
    instructions:
      path: "~/.pi/agent/AGENTS.md"
      master: "AGENTS.md"
    skills_dir: "~/.pi/agent/skills"
sources:
  - name: antfu-skills
    url: "https://github.com/antfu/skills.git"
    subdir: "skills"
    mode: multi
  - name: vercel-labs-skills
    url: "https://github.com/vercel-labs/skills.git"
    subdir: "skills"
    mode: multi
  - name: anthropics-skills
    url: "https://github.com/anthropics/skills.git"
    subdir: "skills"
    mode: multi
  - name: vercel-labs-agent-skills
    url: "https://github.com/vercel-labs/agent-skills.git"
    subdir: "skills"
    mode: multi
  - name: mattpocock-skills
    url: "https://github.com/mattpocock/skills.git"
    subdir: "skills"
    mode: multi
  - name: obra-superpowers
    url: "https://github.com/obra/superpowers.git"
    subdir: "skills"
    mode: multi
