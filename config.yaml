agents:
  claude:
    instructions:
      path: "~/.claude/CLAUDE.md"
      master: "CLAUDE.md"
    skills_dir: "~/.claude/skills"
  codex:
    instructions:
      path: "~/.codex/AGENTS.md"
      master: "CLAUDE.md"
    skills_dir: "~/.codex/skills"
  opencode:
    # no global instructions file found under ~/.config/opencode at migration time
    skills_dir: "~/.config/opencode/skills"
  junie:
    # Junie reads project-level .junie/guidelines.md, not a global instructions file;
    # no global instructions target configured.
    skills_dir: "~/.junie/skills"
  pi:
    # UNCONFIRMED: no skills/ dir or AGENTS.md convention found under ~/.pi at
    # migration time (only ~/.pi/agent/{auth,git,npm,sessions,settings}). Fill in
    # skills_dir / instructions once pi's actual convention is confirmed.
    skills_dir: null
sources:
